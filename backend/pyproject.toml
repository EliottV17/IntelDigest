[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inteldigest"
version = "0.1.0"
description = "Experimental Python backend package for IntelDigest"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.12,<4",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "lxml>=5.4,<7",
    "pydantic>=2.10,<3",
    "readability-lxml>=0.8.4,<1",
    "redis>=6,<7",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.17.3",
]

[tool.hatch.build]
exclude = ["/.venv", "/.uv-cache", "/dist", "/.pytest_cache", "/.ruff_cache", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/inteldigest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
